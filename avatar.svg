<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Alamer">
  <defs>
    <radialGradient id="bg" cx="50%" cy="36%" r="78%">
      <stop offset="0" stop-color="#172741"/>
      <stop offset="0.55" stop-color="#0d1524"/>
      <stop offset="1" stop-color="#080c14"/>
    </radialGradient>

    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#00c8ff" stop-opacity="0.30"/>
      <stop offset="0.6" stop-color="#00c8ff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#00c8ff" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="mono" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00e5ff"/>
      <stop offset="0.5" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#00c8ff" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>

    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="disc">
      <circle cx="200" cy="200" r="200"/>
    </clipPath>
  </defs>

  <g clip-path="url(#disc)">
    <rect width="400" height="400" fill="url(#bg)"/>
    <rect width="400" height="400" fill="url(#grid)"/>
    <circle cx="200" cy="206" r="156" fill="url(#halo)"/>

    <!-- orbit rings -->
    <circle cx="200" cy="200" r="150" fill="none" stroke="#00c8ff" stroke-opacity="0.12" stroke-width="1.5"/>
    <circle cx="200" cy="200" r="171" fill="none" stroke="#7c3aed" stroke-opacity="0.30" stroke-width="1.5"
            stroke-dasharray="5 15" stroke-linecap="round"/>

    <!-- circuit accents -->
    <g fill="none" stroke="#00c8ff" stroke-opacity="0.35" stroke-width="2" stroke-linecap="round">
      <path d="M30 128h36l20 20"/>
      <path d="M370 272h-36l-20-20"/>
      <path d="M78 330v-22"/>
    </g>
    <g fill="#00c8ff" fill-opacity="0.55">
      <circle cx="88" cy="150" r="3.5"/>
      <circle cx="312" cy="250" r="3.5"/>
      <circle cx="78" cy="338" r="3"/>
    </g>

    <!-- monogram A -->
    <g filter="url(#glow)">
      <path d="M118 296 L200 104 L282 296" fill="none" stroke="url(#mono)" stroke-width="34"
            stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M157 226 L243 226" fill="none" stroke="url(#mono)" stroke-width="30" stroke-linecap="round"/>
    </g>

    <!-- inner rim -->
    <circle cx="200" cy="200" r="198" fill="none" stroke="#00c8ff" stroke-opacity="0.10" stroke-width="2"/>
  </g>
</svg>
